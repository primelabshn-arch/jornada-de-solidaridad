html,body{margin:0}

summary em:empty{display:none}
.it small.fr{color:#a67614;font-style:italic}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top h2{flex:1;margin:0;font-size:1.25rem;color:var(--navy)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}

.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab.lock{opacity:.55}
.tab.go{background:var(--gold);color:#fff;border-color:var(--gold);animation:p 1.6s infinite}
@keyframes p{50%{box-shadow:0 0 0 6px #c8962e33}}
.bar{height:10px;background:#e9e4d6;border-radius:99px;overflow:hidden}

.sum{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.sum p{margin:0 0 8px;display:flex;justify-content:space-between;font-weight:700;color:var(--navy)}
.ban{background:#e7f6ee;border:1px solid #b9e3cd;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600;color:#1d6b49}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:8px}

summary .st{flex:1;font-weight:700;color:var(--navy);font-size:.95rem}
summary small{color:var(--mut);font-size:.75rem}

.now{background:var(--gold);color:#fff;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:99px}
.body{padding:0 12px 12px}
.it{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-top:1px solid #f1ebdc;cursor:pointer;line-height:1.35;font-size:.95rem}

.bx{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #b9bdd6;display:grid;place-items:center;margin-top:1px;transition:.15s}
.it input:checked+.bx{background:var(--ok);border-color:var(--ok)}
.it input:checked+.bx:after{content:"✓";color:#fff;font-weight:800}
.it input:checked~span{color:var(--mut);text-decoration:line-through}
.it small{display:block;color:var(--mut);font-size:.8rem;margin-top:2px;text-decoration:none}
.sub{margin:12px 8px 2px;font-weight:800;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.qs{margin:2px 8px 6px 28px;padding:0;color:var(--mut);font-size:.84rem}.qs li{margin:4px 0}

.foot{text-align:center;color:var(--mut);font-size:.75rem;margin:24px 0 8px}

body{transition:background .4s}
.stage{position:fixed;inset:0;z-index:-1;opacity:0;transition:opacity .6s;pointer-events:none;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#1f3380 0%,#0e1a4d 45%,#070d2b 100%)}

.orb{position:absolute;border-radius:50%;filter:blur(45px);will-change:transform}

body.home .foot{color:#8f98cc}

@keyframes fl{50%{transform:translateY(-8px)}}

.pc.mv{transition:transform .08s}

 katherin:{n:'Katherin',c:'1111',e:'📖',s:'Historias',docs:[{k:'katherin',t:'Historias',d:H}]},

 leo:{n:'Leo',c:'3333',e:'📸',s:'Fotos',docs:[{k:'leo',t:'Fotos',d:P}]},
 jose:{n:'José',c:'2026',e:'🎬',s:'Videos y preguntas · Panel',docs:[{k:'jose_videos',t:'Videos',d:V},{k:'jose_preguntas',t:'Preguntas',d:Q}]}};

// ---------- estado local + sincronización ----------
let S=JSON.parse(localStorage.getItem('js_s')||'null')||{it:{},pq:[],me:null};
let tab=null,stt='local';
const save=()=>localStorage.setItem('js_s',JSON.stringify(S));
const get=(k,id)=>(S.it[k]&&S.it[k][id])||{d:0,t:0};
const ids=(doc,si)=>{const r=[];doc.d.forEach((s,a)=>{if(si!=null&&a!=si)return;s.i.forEach((x,b)=>{if(!x.startsWith('## '))r.push(a+'.'+b)})});return r};
const stat=(doc,si)=>{const a=ids(doc,si);return[a.filter(i=>get(doc.k,i).d).length,a.length]};
const sumStat=ds=>ds.reduce((r,d)=>{const s=stat(d);return[r[0]+s[0],r[1]+s[1]]},[0,0]);
const pct=s=>s[1]?Math.round(s[0]/s[1]*100):0;
const last=k=>Math.max(0,...Object.values(S.it[k]||{}).map(x=>x.t));
const ago=t=>{if(!t)return 'sin actividad aún';const m=Math.round((Date.now()-t)/60000);return m<1?'hace un momento':m<60?'hace '+m+' min':m<1440?'hace '+Math.round(m/60)+' h':'hace '+Math.round(m/1440)+' d'};

function toggle(k,id,v){const was=pct(stat(DOCS[k]));const t=Date.now();(S.it[k]=S.it[k]||{})[id]={d:v,t};S.pq.push({k,id,d:v,t});save();refresh();sync();if(v&&was<100&&pct(stat(DOCS[k]))===100)confetti()}

async function sync(){
 if(!SB_URL||!SB_KEY){stt='local';chip();return}
 if(!navigator.onLine){stt='off';chip();return}
 try{
  const h={apikey:SB_KEY,'Content-Type':'application/json'};if(SB_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SB_KEY;
  if(S.pq.length){
   const n=S.pq.length,m={};S.pq.slice(0,n).forEach(x=>m[x.k+'|'+x.id]=x);
   const rows=Object.values(m).map(x=>({scope:x.k,item_id:x.id,done:!!x.d,by_user:S.me||'',updated_at:new Date(x.t).toISOString()}));
   const r=await fetch(SB_URL+'/rest/v1/progress?on_conflict=scope,item_id',{method:'POST',headers:{...h,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
   if(!r.ok)throw 0;S.pq=S.pq.slice(n);
  }
  const r=await fetch(SB_URL+'/rest/v1/progress?select=*',{headers:h});if(!r.ok)throw 0;
  (await r.json()).forEach(x=>{const t=Date.parse(x.updated_at),c=get(x.scope,x.item_id);if(t>c.t)(S.it[x.scope]=S.it[x.scope]||{})[x.item_id]={d:x.done?1:0,t}});
  save();stt='ok';refresh();chip();
 }catch(e){stt='off';chip()}
}
function chip(){const e=document.getElementById('chip');if(!e)return;
 const p=S.pq.length;
 e.className='chip '+(stt==='ok'&&!p?'ok':stt==='off'?'off':'');
 e.textContent=stt==='local'?'Modo local':stt==='off'?'Sin conexión'+(p?' · '+p+' pendientes':''):p?'Sincronizando…':'● Guardado'}
addEventListener('online',sync);
setInterval(()=>{if(!document.hidden)sync()},6000);

// ---------- vistas ----------
const $=s=>document.querySelector(s),app=$('#app');
const nowSec=s=>{if(!s.m)return false;const d=new Date(),m=d.getHours()*60+d.getMinutes();return m>=s.m[0]&&m<s.m[1]};
const own=u=>u.docs;
const genOpen=()=>S.me==='jose'||pct(sumStat(own(U[S.me])))===100;

function home(){
 document.body.classList.add('home');
 app.innerHTML=`<div class=hero><small>UNICAH · CAMPUS ADMINISTRATIVO</small><h1>JORNADA DE SOLIDARIDAD</h1><em>«El Señor es el refugio del pobre»</em><span>(cf. Sal 14,6)</span><p id=ph>${FR[fi]}</p></div>
 <div class=grid>${Object.entries(U).map(([k,u],n)=>`<div class=cw style="--i:${n}"><button class=pc data-u="${k}"><i class=ph style="background-image:url(${IMG[k]})"></i><span class=lk>${S.me===k?'✓ Abierta':'🔒'}</span><div class=in><b>${u.n}</b><small>${u.s}</small><span class=cta>${S.me===k?'Continuar':'Entrar con código'}</span></div></button></div>`).join('')}</div>
 <p class=foot>Equipo de Comunicaciones y Marketing</p>`;
}
function ask(k){
 if(S.me===k){S.me=k;tab=null;return space()}
 const m=document.createElement('div');m.className='mod';
 m.innerHTML=`<div class=mb><h3>Hola, ${U[k].n}</h3><p>Ingresa tu código de acceso</p><input id=cd type=password inputmode=numeric maxlength=4 autocomplete=off><div class=row><button class="btn l" id=x>Cancelar</button><button class=btn id=ok>Entrar</button></div></div>`;
 document.body.appendChild(m);const i=m.querySelector('#cd');i.focus();
 const go=()=>{if(i.value===U[k].c){m.remove();S.me=k;tab=null;save();space();sync()}else{i.classList.add('bad');i.value='';setTimeout(()=>i.classList.remove('bad'),400)}};
 m.querySelector('#ok').onclick=go;m.querySelector('#x').onclick=()=>m.remove();i.onkeydown=e=>{if(e.key==='Enter')go()};
}
function space(){
 document.body.classList.remove('home');
 if(!tmr)sched(20000);
 const u=U[S.me],tabs=[];
 if(S.me==='jose')tabs.push({id:'panel',t:'📊 Panel'});
 u.docs.forEach(d=>tabs.push({id:d.k,t:d.t}));
 tabs.push({id:'generales',t:'Generales'});
 tab=tab||tabs[S.me==='jose'?0:0].id;
 app.innerHTML=`<div class=top><button class="btn l" id=hm>← Inicio</button><i class=av style="background-image:url(${IMG[S.me]})"></i><h2>${u.n}</h2><span id=chip class=chip></span></div>
 <div id=sm class=sum><p><span>Mi avance</span><span data-pt="${u.docs.map(d=>d.k)}"></span></p><div class=bar><div data-pb="${u.docs.map(d=>d.k)}"></div></div></div>
 <div id=dn></div><div class=tabs id=tb></div><div id=ct></div>`;
 $('#hm').onclick=()=>{home()};
 tbs(tabs);view();refresh();chip();
}
function tbs(tabs){
 $('#tb').innerHTML=tabs.map(t=>{const lk=t.id==='generales'&&!genOpen();
  return `<button class="tab ${tab===t.id?'on':''} ${lk?'lock':''} ${t.id==='generales'&&!lk&&S.me!=='jose'&&tab!=='generales'?'go':''}" data-t="${t.id}">${lk?'🔒 ':''}${t.t}</button>`}).join('');
}
function view(){
 const c=$('#ct');
 if(tab==='panel')return c.innerHTML='<div id=panel></div>';
 const doc=tab==='generales'?U[S.me].gen:DOCS[tab];
 let h='';
 if(tab==='generales')h='<div class=sum><p><span>Tomas de video · mi avance</span><span data-pt="gen_'+S.me+'"></span></p><div class=bar><div data-pb="gen_'+S.me+'"></div></div></div>';
 c.innerHTML=h+doc.d.map((s,si)=>`<details class=sec ${nowSec(s)?'open':''}><summary><span class=st>${s.t}</span>${nowSec(s)?'<span class=now>AHORA</span>':''}<small>${s.s||''}</small><em data-c="${doc.k}|${si}"></em></summary><div class=body>${
  (s.q?`<ul class=qs>${s.q.map(x=>`<li>${x}</li>`).join('')}</ul>`:'')+
  s.i.map((x,ii)=>x.startsWith('## ')?`<div class=sub>${x.slice(3)}</div>`:`<label class=it><input type=checkbox data-k="${doc.k}" data-id="${si}.${ii}"><span class=bx></span><span>${x.split('|')[0]}${x.split('|').slice(1).map(y=>`<small${y.startsWith('Frases')?' class=fr':''}>${y}</small>`).join('')}</span></label>`).join('')}</div></details>`).join('');
}
function refresh(){
 document.querySelectorAll('input[data-k]').forEach(c=>c.checked=!!get(c.dataset.k,c.dataset.id).d);
 document.querySelectorAll('[data-c]').forEach(e=>{const[k,si]=e.dataset.c.split('|'),s=stat(DOCS[k],+si);e.textContent=s[1]?s[0]+'/'+s[1]:'';e.className=s[0]===s[1]?'full':''});
 document.querySelectorAll('[data-pb]').forEach(e=>{e.style.width=pct(sumStat(e.dataset.pb.split(',').map(k=>DOCS[k])))+'%'});
 document.querySelectorAll('[data-pt]').forEach(e=>{const s=sumStat(e.dataset.pt.split(',').map(k=>DOCS[k]));e.textContent=s[0]+'/'+s[1]+' · '+pct(s)+'%'});
 if(!S.me)return;
 const dn=$('#dn');
 if(dn){const done=pct(sumStat(own(U[S.me])))===100;dn.innerHTML=done&&S.me!=='jose'?'<div class=ban>🎉 ¡Terminaste tu lista! Ya puedes comenzar en <b>Generales</b>.</div>':''}
 const tb=$('#tb');if(tb){const tabs=[...tb.children].map(b=>({id:b.dataset.t,t:b.textContent.replace('🔒 ','')}));tbs(tabs)}
 const p=$('#panel');if(p)p.innerHTML=Object.entries(U).map(([k,u])=>{const all=sumStat(u.docs),ds=u.docs.concat([u.gen]);
  return `<div class=pn><h3><span style="display:flex;align-items:center;gap:8px"><i class=av style="width:34px;height:34px;background-image:url(${IMG[k]})"></i>${u.n}</span><span>${pct(all)}%</span></h3>${ds.map(d=>{const t=stat(d);return `<div class=r><span>${d.t}</span><span>${t[0]}/${t[1]}</span></div><div class=bar><div style="width:${pct(t)}%"></div></div>`}).join('')}<div class=la>Última actividad: ${ago(Math.max(...ds.map(d=>last(d.k))))}</div></div>`}).join('');
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}

app.addEventListener('click',e=>{
 const c=e.target.closest('[data-u]');if(c)return ask(c.dataset.u);
 const t=e.target.closest('[data-t]');
 if(t){if(t.dataset.t==='generales'&&!genOpen())return toast('Completa tu lista para desbloquear Generales');tab=t.dataset.t;space()}
});
app.addEventListener('change',e=>{const c=e.target;if(c.dataset.k)toggle(c.dataset.k,c.dataset.id,c.checked?1:0)});


const FR=['«La solidaridad se demuestra con acciones».','«Servir es compartir lo que somos y lo que tenemos».','«Pequeños gestos pueden llevar grandes mensajes de esperanza».','«Una jornada para acercarnos, acompañar y servir».','«La fe también se expresa en el amor al prójimo».','«Juntos hacemos de la solidaridad una acción concreta».'];let fi=0;
setInterval(()=>{const e=document.getElementById('ph');if(!e)return;e.style.opacity=0;setTimeout(()=>{fi=(fi+1)%FR.length;e.textContent=FR[fi];e.style.opacity=1},500)},5000);
let MX=0,MY=0;
function par(){document.querySelectorAll('.orb').forEach(o=>{o.style.transform=`translate(${MX*o.dataset.d}px,${MY*o.dataset.d+scrollY*o.dataset.s}px)`})}
addEventListener('pointermove',e=>{MX=e.clientX/innerWidth-.5;MY=e.clientY/innerHeight-.5;par()});
addEventListener('scroll',par,{passive:true});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;MX=Math.max(-.5,Math.min(.5,e.gamma/60));MY=Math.max(-.5,Math.min(.5,(e.beta-45)/90));par()});
app.addEventListener('pointermove',e=>{const c=e.target.closest('.pc');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.classList.add('mv');c.style.setProperty('--px',x*2);c.style.setProperty('--py',y*2);c.style.setProperty('--gx',(x+.5)*100+'%');c.style.setProperty('--gy',(y+.5)*100+'%');c.style.transform=`perspective(700px) rotateY(${x*16}deg) rotateX(${-y*16}deg) scale(1.04)`});
const rs=e=>{if(e.type==='pointerup'&&e.pointerType==='mouse')return;const c=e.target.closest('.pc');if(!c||c.contains(e.relatedTarget))return;c.classList.remove('mv');c.style.transform='';c.style.setProperty('--px',0);c.style.setProperty('--py',0)};
['pointerout','pointerup','pointercancel'].forEach(t=>app.addEventListener(t,rs));
function pts(){const w=document.getElementById('pts');for(let i=0;i<26;i++){const p=document.createElement('span'),z=2+Math.random()*4;p.className='pt';p.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;--t:${9+Math.random()*10}s;--dl:-${Math.random()*14}s;--x:${(Math.random()-.5)*60}px`;w.appendChild(p)}}
function confetti(){const c=document.getElementById('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const col=['#ffd978','#c8962e','#ffffff','#2e9e6b','#6c8cff'],P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*6,s:4+Math.random()*5,c:col[Math.random()*5|0]}));
 let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<140)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}

 start:['¡Vamos, tú puedes! 💪','Recuerda ir marcando lo que ya realizaste ✅','Cada foto y cada toma cuentan, ¡ánimo!','¡Qué buen equipo somos! 🙌','Un paso a la vez, lo estás haciendo genial','No olvides marcar tu avance para que todos lo veamos 👀','¡Confiamos en ti, vamos con todo!','Tu trabajo hará que esta jornada se recuerde ✨'],
 half:['¡Ya llevas buen avance, sigue así! 🔥','¡Vas muy bien! Marca cada casilla para guardar tu progreso','¡Qué ritmo! Vamos por más 🙌'],

let tmr=0,ndT;
const pick=a=>a[Math.random()*a.length|0];
function nudge(){
 if(!S.me||document.body.classList.contains('home')||document.hidden||document.querySelector('.mod'))return;
 const p=pct(sumStat(U[S.me].docs)),pool=p===100?MSG.done:p>=80?MSG.near:p>=40?MSG.half:MSG.start,k=pick(Object.keys(U).filter(x=>x!==S.me));
 document.querySelectorAll('.nd').forEach(e=>e.remove());clearTimeout(ndT);
 const e=document.createElement('div');e.className='nd';
 e.innerHTML=`<i class=av style="background-image:url(${IMG[k]})"></i><div><b>${U[k].n}</b><span>${pick(pool)}</span></div><button aria-label=Cerrar>×</button>`;
 document.body.appendChild(e);
 const hide=()=>{e.classList.remove('on');setTimeout(()=>e.remove(),600)};
 e.querySelector('button').onclick=hide;e.onclick=hide;
 requestAnimationFrame(()=>requestAnimationFrame(()=>e.classList.add('on')));
 ndT=setTimeout(hide,7000);
}
const sched=d=>{tmr=setTimeout(()=>{nudge();sched(45000+Math.random()*30000)},d)};
